workflows:
  android-workflow:
    name: Instrubyte CRM - Android
    max_build_duration: 60
    # mac_mini_m2 (not linux_x2) so this runs on the free 500 min/month pool —
    # Linux/Windows instances require billing to be enabled even for Android.
    # Codemagic's Mac images ship with the Android SDK preinstalled.
    instance_type: mac_mini_m2
    environment:
      node: 20
      groups:
        # Create this group in Codemagic > Teams > Environment variables.
        # Needed only once you're ready to publish to Play Console:
        # GCLOUD_SERVICE_ACCOUNT_CREDENTIALS (Google Play service account JSON)
        - google_play
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: master
          include: true
    scripts:
      - name: Install npm dependencies
        script: npm ci
      - name: Sync Capacitor Android project
        script: npx cap sync android
      - name: Build Android release bundle
        script: |
          cd android
          ./gradlew bundleRelease
    artifacts:
      - android/app/build/outputs/**/*.aab
      - android/app/build/outputs/**/*.apk
    publishing:
      email:
        recipients:
          - kentoy634@gmail.com
      # Uncomment once the google_play group above has real credentials.
      # google_play:
      #   credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
      #   track: internal

  ios-workflow:
    name: Instrubyte CRM - iOS
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      node: 20
      xcode: latest
      cocoapods: default
      groups:
        # Create this group in Codemagic > Teams > Environment variables,
        # and attach your App Store Connect API key as an integration
        # (Codemagic > Teams > Integrations > Apple Developer Portal).
        - app_store_credentials
      vars:
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: master
          include: true
    scripts:
      - name: Install npm dependencies
        script: npm ci
      - name: Sync Capacitor iOS project
        script: npx cap sync ios
      - name: Install CocoaPods dependencies
        script: |
          cd ios/App
          pod install
      - name: Set up code signing (uses the Apple Developer Portal integration)
        script: |
          xcode-project use-profiles
      - name: Build .ipa
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients:
          - kentoy634@gmail.com
      # Uncomment once code signing is wired up above.
      # app_store_connect:
      #   auth: integration
      #   submit_to_testflight: true
